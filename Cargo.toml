[package]
name = "aegisub-mcp"
version = "0.3.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.4", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
